# Secret-scanning config.
#
# Extends the bundled ruleset rather than replacing it — the value of gitleaks
# is that its rules are an opinion this project did not author, and rewriting
# them would demote it from an External check to a Suite one (CONSTRAINTS.md).
[extend]
useDefault = true

[allowlist]
description = "Generated paths, gitignored env files, and one deliberately published value"

# The Supabase publishable key, in the build config only.
#
# Matched on the whole assignment — variable name, key prefix and all — so it
# exempts this one value and nothing else. A service_role key, a different
# variable, or any other secret still fails, including in this same file.
#
# Added to the GLOBAL allowlist rather than as a [[rules]] block. Declaring
# `[[rules]] id = "generic-api-key"` does not narrow the built-in rule, it
# REPLACES it: the first attempt at this silently switched off generic-key
# detection across the whole repository, so an sk_live_ key in any source file
# passed. A loosening that disables the check is worse than the problem.
regexTarget = "line"
regexes = [
  '''VITE_SUPABASE_ANON_KEY = "sb_publishable_[A-Za-z0-9_-]+"''',
]

paths = [
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)coverage/''',
  '''(^|/)\.git/''',
  '''pnpm-lock\.yaml$''',
  # Local environment files, which .gitignore already refuses to commit.
  #
  # This is where a key is SUPPOSED to live while developing, and the secrets
  # gate scans the working tree, so without this the gate goes red the moment
  # anyone configures the app correctly. A gate that fails on correct behaviour
  # teaches people to ignore it, which costs more than it protects.
  #
  # Listed one by one rather than as a pattern excluding .env.example: these
  # regexes are Go's RE2, which has no lookahead, and a pattern that fails to
  # compile takes the whole gate down rather than loosening it.
  #
  # .env.example is deliberately absent — it IS committed, so a real value in
  # it must still fail. A key anywhere else in the tree — a source file, a
  # script, a fixture — is untouched by this and still fails the gate.
  '''(^|/)\.env$''',
  '''(^|/)\.env\.local$''',
  '''(^|/)\.env\.development$''',
  '''(^|/)\.env\.production$''',
  '''(^|/)\.env\.test$''',
]
