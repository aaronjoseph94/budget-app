# Secret-scanning config: the history scan's, and the base of the working
# tree's (.gitleaks-tree.toml), which adds only local .env files.
#
# Extends the bundled ruleset rather than replacing it — the value of gitleaks
# is that its rules are an opinion this project did not author, and rewriting
# them would demote it from an External check to a Suite one (CONSTRAINTS.md).
[extend]
useDefault = true

[allowlist]
description = "Generated paths and one deliberately published value"

# The Supabase publishable key, in the build config only.
#
# Matched on the whole assignment — variable name, key prefix and all — so it
# exempts this one value and nothing else. A service_role key, a different
# variable, or any other secret still fails, including in this same file.
#
# Added to the GLOBAL allowlist rather than as a [[rules]] block. Declaring
# `[[rules]] id = "generic-api-key"` does not narrow the built-in rule, it
# REPLACES it: the first attempt at this silently switched off generic-key
# detection across the whole repository, so an sk_live_ key in any source file
# passed. A loosening that disables the check is worse than the problem.
regexTarget = "line"
regexes = [
  '''VITE_SUPABASE_ANON_KEY = "sb_publishable_[A-Za-z0-9_-]+"''',
]

paths = [
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)coverage/''',
  '''(^|/)\.git/''',
  '''pnpm-lock\.yaml$''',
]

# Keys the bundled rules miss unless the line happens to say "key" or
# "secret" (security-c2-03): the project's own RLS-bypassing secret key, and
# two providers the AI helper can use. New ids, so they add to the bundled
# rules rather than replace one (see above).
[[rules]]
id = "supabase-secret-key"
description = "Supabase secret key, which bypasses every row-level security policy"
regex = '''\bsb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]

[[rules]]
id = "groq-api-key"
description = "Groq API key"
regex = '''\bgsk_[A-Za-z0-9]{40,}'''
keywords = ["gsk_"]

[[rules]]
id = "openrouter-api-key"
description = "OpenRouter API key"
regex = '''\bsk-or-v1-[0-9a-f]{64}\b'''
keywords = ["sk-or-v1-"]
