<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--border,#E5E7EB);min-height:64px;box-sizing:border-box;font-family:ui-sans-serif,system-ui,-apple-system,'SF Pro Text','Segoe UI',sans-serif;color:var(--ink,#111827);">
  <button aria-label="Toggle sidebar" style="width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:none;border:0;cursor:pointer;color:inherit;" style-hover="background:var(--hover,#F9FAFB);"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg></button>
  <div style="width:1px;height:20px;background:var(--border,#E5E7EB);"></div>
  <nav aria-label="Breadcrumb" style="display:flex;align-items:center;gap:8px;font-size:16px;color:var(--muted,#6B7280);">
    <a href="Month.dc.html" style="text-decoration:none;color:inherit;">Budget</a>
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
    <span style="color:var(--ink,#111827);font-weight:500;">{{ crumb }}</span>
  </nav>
  <div style="flex:1;"></div>
  <label style="display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border:1px solid var(--border,#E5E7EB);border-radius:10px;color:var(--muted,#6B7280);font-size:15px;width:min(360px,30vw);box-sizing:border-box;">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <input aria-label="Search or jump to" placeholder="Search or jump to…" style="flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;color:var(--ink,#111827);">
    <kbd style="font:inherit;font-size:12px;color:var(--muted,#6B7280);background:var(--track,#E5E7EB);border-radius:6px;padding:2px 6px;">⌘K</kbd>
  </label>
  <a href="Add.dc.html" style="display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:10px;background:var(--accent,#4F46E5);color:#FFFFFF;font-weight:500;font-size:15px;text-decoration:none;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Add</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:64},&quot;crumb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Month&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
