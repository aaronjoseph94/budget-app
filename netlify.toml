# Preview hosting for the app. CLAUDE.md's stack names Cloudflare Pages as the
# eventual home on the user's own domain; this is a place to look at the thing
# while it is being built, not that decision being revisited.
[build]
  command = "pnpm --filter @budget/app-client build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.33.0"  # as packageManager in package.json

  # The two public Supabase values, compiled into the bundle at build time.
  #
  # These are here rather than in Netlify's environment settings because that
  # API accepted two writes without storing either, then returned 422; a build
  # that silently lacks its configuration is worse than one whose configuration
  # is visible.
  #
  # Safe to commit, deliberately and narrowly:
  #   - The repository is private.
  #   - A publishable key is DESIGNED to be seen. It travels in every request
  #     the browser makes and is readable in the deployed JavaScript by anyone
  #     who opens the site, so keeping it out of the repository protects
  #     nothing that is not already public the moment this deploys.
  #   - The row-level security policies in supabase/migrations are what
  #     actually protect the data. This key cannot read another user's rows.
  #
  # The service_role key is a different thing entirely and must NEVER appear
  # here, in any VITE_ variable, or anywhere else reachable from the browser:
  # it bypasses every one of those policies.
  #
  # To rotate: change it in Supabase, change it here, push. It is in git
  # history, which is the cost of this choice and the reason it applies only
  # to a key meant to be public.
  VITE_SUPABASE_URL = "https://bnodrfghxbavlopxkgju.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_7DPi7R1g44DDO20akSeYvQ_onu0VnK0"

# A single-page app: every path serves the same document and the client routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The app reads a statement in the browser and sends it nowhere. These headers
# say so in a way a browser enforces rather than a way a README claims.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Why, and what must stay true of these: apps/web/public/_headers.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://bnodrfghxbavlopxkgju.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'"

# Hashed build files, kept for a year: see apps/web/public/_headers.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
