name: Gates

# The CI that CONSTRAINTS.md's rows marked "CI" (Coverage, Dependencies,
# Migration replay, RLS coverage, Web first load and others) name.
on:
  push:
    branches: ['**']
  pull_request:

# This job only reads the code and reports. It never needs to write, so the
# token it runs with cannot. Without this block the job inherits the
# repository default, which may be read-write — and a third-party action in
# the steps below would inherit a token able to push commits.
permissions:
  contents: read

# A newer push to the same branch stops the run it supersedes, so runs do
# not pile up behind one another on the runner (architecture-b-01).
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    # The suite with coverage takes about 7 minutes here, and the bundle
    # build follows it. At 15 minutes, 8 of 14 runs were cancelled before
    # coverage, deps and bundle ran, and a cancelled run shows grey, not red.
    timeout-minutes: 30

    steps:
      # Each action is pinned to a commit, the one its v4 tag named on
      # 2026-10-01: a tag can be moved by the action's owner, and a moved one
      # could report these gates green without running them (security-b-06).
      # Dependabot (.github/dependabot.yml) proposes new pins as reviewed PRs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gitleaks' history scan walks commits, so a shallow clone would scan
          # one commit and report clean for a secret added earlier.
          fetch-depth: 0
          # Do not leave the token in .git/config where any later step, or any
          # action those steps invoke, could pick it up.
          persist-credentials: false

      # No version here: it reads packageManager in package.json, and names
      # one pnpm for CI, the session and the hosts (SEC-6). Given both, it
      # refuses to run.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install gitleaks
        run: ./scripts/install-gitleaks.sh

      # gates.sh fails closed: a missing tool exits 2 as MISCONFIGURED rather
      # than passing quietly, so a broken runner cannot look like a green build.
      - name: Run gates
        run: ./scripts/gates.sh full
        env:
          GATES_LOG_DIR: ${{ runner.temp }}/gate-logs

      # Every gate's full log, kept even when the run fails or times out, so
      # a slow or failing gate can be read rather than guessed at.
      - name: Keep the gate logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-logs
          path: ${{ runner.temp }}/gate-logs
          if-no-files-found: ignore
          retention-days: 14
