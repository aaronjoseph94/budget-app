name: Gates

# CONSTRAINTS.md marks Coverage and Dependencies as running "at CI". This is
# that CI. Until it existed, those two rows named a place that did not exist,
# which is the same failure as a gate that reports PASS without running.
on:
  push:
    branches: ['**']
  pull_request:

# This job only reads the code and reports. It never needs to write, so the
# token it runs with cannot. Without this block the job inherits the
# repository default, which may be read-write — and a third-party action in
# the steps below would inherit a token able to push commits.
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks' history scan walks commits, so a shallow clone would scan
          # one commit and report clean for a secret added earlier.
          fetch-depth: 0
          # Do not leave the token in .git/config where any later step, or any
          # action those steps invoke, could pick it up.
          persist-credentials: false

      # No version here: it reads packageManager in package.json, and names
      # one pnpm for CI, the session and the hosts (SEC-6). Given both, it
      # refuses to run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install gitleaks
        run: ./scripts/install-gitleaks.sh

      # gates.sh fails closed: a missing tool exits 2 as MISCONFIGURED rather
      # than passing quietly, so a broken runner cannot look like a green build.
      - name: Run gates
        run: ./scripts/gates.sh full
